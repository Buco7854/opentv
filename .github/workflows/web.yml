name: Web CI

# Runs only when the server/web client, the shared modules, or the build
# configuration change (tag pushes always run: new refs skip path filters).
# A weekly clean rebuild also picks up base-image and Ubuntu package patches.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "server/**"
      - "server-data/**"
      - "core/**"
      - "data/**"
      - "server-contract/**"
      - "Dockerfile"
      - ".dockerignore"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".node-version"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "server-data/**"
      - "core/**"
      - "data/**"
      - "server-contract/**"
      - "Dockerfile"
      - ".dockerignore"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".node-version"
      - ".github/workflows/web.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 2" # Tuesdays at 04:23 UTC, from the default branch.

jobs:
  build:
    name: Test, build & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          check-latest: true
          cache: npm
          cache-dependency-path: server/webapp/package-lock.json

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Run shared/server tests and build the server
        run: ./gradlew :server-data:jvmTest :core:jvmTest :data:jvmTest :server:test :server:installDist

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default buildx builder uses the docker driver, which cannot export a
      # GitHub Actions cache. This provisions a docker-container builder that can.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/opentv-web
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build (and push) image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Ordinary builds reuse layers; scheduled builds rerun package installs
          # against current repositories instead of reusing an old apt layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
